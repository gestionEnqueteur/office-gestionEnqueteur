<h2>Mes courses réalisées</h2>

<mat-form-field appearance="outline">
  <mat-label>Filtrer par ligne</mat-label>
  <mat-select [(ngModel)]="filtreLigne">
    <mat-option value="">Toutes</mat-option>
    <mat-option *ngFor="let ligne of lignesDisponibles" [value]="ligne">{{ ligne }}</mat-option>
  </mat-select>
</mat-form-field>

<mat-table [dataSource]="filteredCourses" class="mat-elevation-z4">

  <!-- Colonne Date -->
  <ng-container matColumnDef="date">
    <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{ element.date }} </mat-cell>
  </ng-container>

  <!-- Ligne / Train -->
  <ng-container matColumnDef="ligne">
    <mat-header-cell *matHeaderCellDef> Ligne </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{ element.ligne }} </mat-cell>
  </ng-container>

  <!-- Départ / Arrivée -->
  <ng-container matColumnDef="trajet">
    <mat-header-cell *matHeaderCellDef> Trajet </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{ element.depart }} → {{ element.arrivee }} </mat-cell>
  </ng-container>

  <!-- Heures -->
  <ng-container matColumnDef="heures">
    <mat-header-cell *matHeaderCellDef> Horaires </mat-header-cell>
    <mat-cell *matCellDef="let element"> {{ element.hd }} → {{ element.ha }} </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="colonnes"></mat-header-row>
  <mat-row *matRowDef="let row; columns: colonnes;"></mat-row>
</mat-table>

<hr>

<h3>🧮 Heures réalisées</h3>
<p><strong>Total :</strong> beaucoup d'heures</p>
